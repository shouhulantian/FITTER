# Same as inf_ICEWS14.yaml but with multi-step rolling forecasting eval:
# after scoring queries at time t, the model's TOP-1 predictions are
# appended to the history graph before scoring t+1 (errors compound).
# For ground-truth-appending semantics use eval_mode: single_step instead.
output_dir:  ~/git/output

dataset:
  class: {{ dataset }}
  root: ~/git/kg-datasets/

model:
  class: FITTER
  relation_model:
    class: NBFNet
    input_dim: 64
    hidden_dims: [64,64,64,64,64,64]
    message_func: dual
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
    time_graph: default
    window_size: 1
  entity_model:
    class: IndNBFNet
    input_dim: 64
    hidden_dims: [64,64,64,64,64,64]
    message_func: tcomplx
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
    use_time: nbf_concat
    remove_edge: default
    boundary: default
    project_times: True
    time_dependent: False
    alpha: 0.8

task:
  name: TransductiveInference
  num_negative: 512
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10]
  eval_mode: multi_step
  # rebuild_relation_graph_per_step: True   # optional; slower but exact

optimizer:
  class: AdamW
  lr: 5.0e-4

train:
  gpus: {{ gpus }}
  batch_size: 1
  num_epoch: {{ epochs }}
  log_interval: 100
  batch_per_epoch: {{ bpe }}

checkpoint: {{ ckpt }}
